<!doctype html>
<html lang="en" translate="no" class="notranslate scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <meta http-equiv="Content-Language" content="en" />
    <link rel="icon" type="image/jpeg" href="/images/murad-rahman.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murad Rahman — Graphics Designer & Web Developer</title>
    <meta name="description" content="মুরাদ রহমান — Graphics Design, Blogger-ভিত্তিক আধুনিক ওয়েবসাইট ও Web Development এর প্রফেশনাল পোর্টফোলিও।" />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Murad Rahman — Graphics Designer & Web Developer" />
    <meta property="og:description" content="মুরাদ রহমান — পরিষ্কার, আধুনিক এবং ব্যবহারবান্ধব ডিজাইন ও ওয়েব অভিজ্ঞতা।" />
    <meta property="og:image" content="/images/murad-rahman.jpg" />
    
    <!-- Performance Optimization: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload Critical Hero Image with High Priority -->
    <link rel="preload" as="image" href="/images/murad-rahman.jpg" fetchpriority="high" />

    <!-- Google Fonts for English & Bangla -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Netlify Badge & Drawer Auto-Suppressor -->
    <script>
      (function() {
        try {
          localStorage.setItem('netlify-badge-dismissed', 'true');
          localStorage.setItem('netlify-drawer-dismissed', 'true');
        } catch(e) {}
        var removeNetlify = function() {
          var sel = 'iframe[src*="netlify"], iframe[title*="Netlify"], #netlify-drawer, netlifydrawer-app, .netlify-badge, [class*="netlify-drawer"], [class*="NetlifyDrawer"]';
          document.querySelectorAll(sel).forEach(function(el) {
            try { el.remove(); } catch(e) { el.style.display = 'none'; }
          });
        };
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeNetlify);
          window.addEventListener('load', removeNetlify);
          if (typeof MutationObserver !== 'undefined') {
            new MutationObserver(removeNetlify).observe(document.documentElement, { childList: true, subtree: true });
          }
        }
      })();
    </script>
  </head>
  <body class="bg-white text-slate-800 antialiased selection:bg-[#0284c7] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
