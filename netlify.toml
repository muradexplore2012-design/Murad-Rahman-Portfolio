# Netlify Configuration for Murad Rahman Portfolio
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NETLIFY_DRAWER_ENABLED = "false"

[context.production.environment]
  NETLIFY_DRAWER_ENABLED = "false"

[context.deploy-preview.environment]
  NETLIFY_DRAWER_ENABLED = "false"

[context.branch-deploy.environment]
  NETLIFY_DRAWER_ENABLED = "false"

# Firebase Auth Proxy: Routes /__/auth/handler to Firebase backend for custom authDomain
[[redirects]]
  from = "/__/*"
  to = "https://murad-rahman-994ed.firebaseapp.com/__/:splat"
  status = 200
  force = true

# SPA Fallback: Ensures /admin, /contact, etc. work without 404 on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static hashed assets for 1 year (Ultra Fast CDN load)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer-when-downgrade"
